<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 12 - Zona de texto con contador</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor-mensaje">
        <h2 class="titulo-mensaje">Escribe tu mensaje</h2>
        
        <div class="zona-texto-con-contador">
            <textarea 
                id="campoMensaje" 
                class="area-escritura" 
                maxlength="250" 
                placeholder="Empieza a escribir ..."></textarea>
            <div class="contador-caracteres" id="contadorCaracteres">0 / 250</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
